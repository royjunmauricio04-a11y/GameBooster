name: Android debug APK

on:
  push:
    branches: [main, 'feature/**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4.0.4

      - name: Install Android platform and build tools
        run: sdkmanager --install "platforms;android-34" "build-tools;34.0.0"

      - name: Configure Supabase build values
        id: supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Supabase secrets are not set; this build will not replace the downloadable APK."
            exit 0
          fi
          python3 - <<'PY'
          import base64
          import json
          import os
          import sys
          from urllib.parse import urlparse

          url = os.environ["SUPABASE_URL"].strip()
          key = os.environ["SUPABASE_ANON_KEY"].strip()
          parsed = urlparse(url)
          if parsed.scheme != "https" or not parsed.hostname:
              print("SUPABASE_URL must be an HTTPS project URL.", file=sys.stderr)
              sys.exit(1)
          if key.startswith("sb_publishable_"):
              pass
          elif key.startswith("sb_secret_"):
              print("Refusing to embed an sb_secret key in the Android APK; use the public publishable key.", file=sys.stderr)
              sys.exit(1)
          else:
              parts = key.split(".")
              if len(parts) != 3:
                  print("Use a public sb_publishable key or a legacy anon JWT.", file=sys.stderr)
                  sys.exit(1)
              try:
                  payload = parts[1] + "=" * ((4 - len(parts[1]) % 4) % 4)
                  role = json.loads(base64.urlsafe_b64decode(payload)).get("role")
              except Exception:
                  role = None
              if role != "anon":
                  print("Refusing to embed a JWT that is not the public anon key.", file=sys.stderr)
                  sys.exit(1)
          print("Public Supabase client key type validated; values were not printed.")
          PY
          printf 'SUPABASE_URL=%s\n' "$SUPABASE_URL" > local.properties
          printf 'SUPABASE_ANON_KEY=%s\n' "$SUPABASE_ANON_KEY" >> local.properties
          echo "configured=true" >> "$GITHUB_OUTPUT"

      - name: Run Android tests and assemble debug APK
        run: ./gradlew --no-daemon :app:testDebugUnitTest :app:assembleDebug

      - name: Read APK version
        id: apk_version
        run: |
          VERSION_NAME=$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -1)
          VERSION_CODE=$(sed -n 's/.*versionCode = \([0-9]*\).*/\1/p' app/build.gradle.kts | head -1)
          echo "artifact_name=GameBooster-v${VERSION_NAME}-code${VERSION_CODE}-debug" >> "$GITHUB_OUTPUT"
          echo "version_name=${VERSION_NAME}" >> "$GITHUB_OUTPUT"
          echo "version_code=${VERSION_CODE}" >> "$GITHUB_OUTPUT"

      - name: Upload versioned debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk_version.outputs.artifact_name }}
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Update latest public debug APK release
        if: github.ref == 'refs/heads/main' && steps.supabase.outputs.configured == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          ASSET="$APK#GameBooster-v${{ steps.apk_version.outputs.version_name }}.apk"
          if gh release view gamebooster-latest --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload gamebooster-latest "$ASSET" --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create gamebooster-latest "$ASSET" \
              --title "Game Booster latest debug APK" \
              --notes "Automated debug/test APK for GameBooster v${{ steps.apk_version.outputs.version_name }} (version code ${{ steps.apk_version.outputs.version_code }}). Public pre-release, not a Play Store build. Test VPN and gateway behavior on a spare device before relying on it." \
              --prerelease --repo "$GITHUB_REPOSITORY"
          fi
